# ~/.config/rtop/config.toml (or --config PATH)
interval = 1000                 # ms, 100..60000
filesystem_interval = 30000     # ms, refreshed on the next collector sample
hardware_interval = 2000       # ms, GPU/sensors, 1000..60000
history = 120                   # samples per series, 10..3600
theme = "dark"                  # dark | light
ascii = false
no_color = false
# network_interface = "eth0"    # default: first non-loopback interface
# disk_device = "sda"           # name or major:minor; default: device backing selected mount
# mount = "/"                   # default: root filesystem
